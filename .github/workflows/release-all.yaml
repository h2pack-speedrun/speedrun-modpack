name: Release All
run-name: ${{ format('{0} {1}', inputs.is-dry-run && 'Dry-run' || 'Release', inputs.tag || 'auto versions') }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Lockstep version for every selected repo (e.g. 1.0.1). Blank computes each repo's version from its commits."
        required: false
      versions:
        description: "Per-repo version overrides, comma-separated Target=Major.Minor.Patch (e.g. LiveSplit=6.0.0,Coordinator=6.1.0)"
        required: false
      is-dry-run:
        description: "Dry-run (trigger dry-runs on all repos, no publish)"
        type: boolean
      modules:
        description: "Comma-separated repo names to release (blank = all)"
        required: false
      lib-version:
        description: "ModpackLib dependency version to pin in child releases (blank keeps current pins)"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TOOLS_REF: "release-tools-V3"

jobs:
  release:
    name: Trigger releases
    runs-on: ubuntu-latest
    steps:
      - name: Check release dispatch token
        env:
          RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$RELEASE_DISPATCH_TOKEN" ]; then
            echo "::error title=Missing RELEASE_DISPATCH_TOKEN::Set a repository or organization secret named RELEASE_DISPATCH_TOKEN using a fine-grained PAT or GitHub App token with Contents: read and Actions: read/write access to the shell, coordinator, and module repositories."
            exit 1
          fi

      - name: Verify shell CI passed for release commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          ci_run=$(gh run list \
            --repo "$REPO" \
            --workflow "ci.yaml" \
            --commit "$SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$ci_run" ]; then
            echo "::error title=CI has not passed::No successful ci.yaml run was found for $SHA. Push the shell commit and wait for CI before release_all."
            exit 1
          fi
          echo "Found successful CI run $ci_run for $SHA."

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}

      - name: Check out release branch heads
        run: |
          # Releases ship what is on each repo's release branch, so the shell pointers cannot go stale.
          # ModpackTools stays on its pinned commit because the release scripts run from it.
          for path in $(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            if [ "$path" = "ModpackTools" ]; then
              continue
            fi
            git submodule update --remote --checkout -- "$path"
            # Submodules are cloned shallow; version planning needs full history and every tag.
            git -C "$path" fetch --unshallow --tags --quiet || git -C "$path" fetch --tags --quiet
          done
          git submodule status

      - name: Validate platform dependency versions
        run: python3 ModpackTools/validate_platform_versions.py

      - name: Validate release plan
        env:
          TAG: ${{ inputs.tag }}
          VERSIONS: ${{ inputs.versions }}
          DRY_RUN: ${{ inputs.is-dry-run }}
          FILTER: ${{ inputs.modules }}
          LIB_VERSION: ${{ inputs['lib-version'] }}
        run: |
          args=(
            --org "h2pack-speedrun"
            --team "adamantSpeedrun"
            --coordinator-repo "adamantSpeedrun-Speedrun_Modpack"
            --child-dry-run "$DRY_RUN"
            --targets "$FILTER"
            --pin-coordinator-module-deps
            --module-field "tools-ref=$TOOLS_REF"
            --coordinator-field "tools-ref=$TOOLS_REF"
          )
          if [ -n "$TAG" ]; then
            args+=(--tag "$TAG")
          fi
          if [ -n "$VERSIONS" ]; then
            args+=(--versions "$VERSIONS")
          fi
          if [ -n "$LIB_VERSION" ]; then
            args+=(--module-field "lib-version=$LIB_VERSION")
            args+=(--coordinator-field "lib-version=$LIB_VERSION")
          fi
          python3 ModpackTools/github/release_all.py "${args[@]}" --plan-only

      - name: Trigger release workflows
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSIONS: ${{ inputs.versions }}
          DRY_RUN: ${{ inputs.is-dry-run }}
          FILTER: ${{ inputs.modules }}
          LIB_VERSION: ${{ inputs['lib-version'] }}
        run: |
          args=(
            --org "h2pack-speedrun"
            --team "adamantSpeedrun"
            --coordinator-repo "adamantSpeedrun-Speedrun_Modpack"
            --child-dry-run "$DRY_RUN"
            --targets "$FILTER"
            --verify-ci
            --pin-coordinator-module-deps
            --module-field "tools-ref=$TOOLS_REF"
            --coordinator-field "tools-ref=$TOOLS_REF"
          )
          if [ -n "$TAG" ]; then
            args+=(--tag "$TAG")
          fi
          if [ -n "$VERSIONS" ]; then
            args+=(--versions "$VERSIONS")
          fi
          if [ -n "$LIB_VERSION" ]; then
            args+=(--module-field "lib-version=$LIB_VERSION")
            args+=(--coordinator-field "lib-version=$LIB_VERSION")
          fi
          python3 ModpackTools/github/release_all.py "${args[@]}"

      - name: Record released submodule pointers
        if: ${{ !inputs.is-dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pick up the release commits the child workflows just pushed.
          for path in $(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            if [ "$path" = "ModpackTools" ]; then
              continue
            fi
            git submodule update --remote --checkout -- "$path"
            git add "$path"
          done
          if git diff --cached --quiet; then
            echo "Submodule pointers already current."
            exit 0
          fi
          git commit --message "chore: update submodules after release"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
